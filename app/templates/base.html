{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Приют для животных{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <h2><a href="{% url 'index' %}">🐾 Приют «Лапа помощи»</a></h2>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}">Личный кабинет</a>
                <a href="/admin/" target="_blank">Админка</a>
                <form action="{% url 'logout' %}" method="post">{% csrf_token %}<button>Выйти</button></form>
            {% else %}
                <a href="{% url 'login' %}">Войти</a>
                <a href="{% url 'register' %}">Регистрация</a>
            {% endif %}
        </nav>
    </header>
    <div class="container">{% block content %}{% endblock %}</div>
</body>
</html>
